
name: CI/CD Python - EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: repo/trabalho
  CONTAINER_NAME: devops-python-api
  APP_PORT: "8000"

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # JOB 1 - QUALIDADE E TESTES
  # ==========================================

  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Analise estatica
        run: ruff check .

      - name: Verificar formatacao
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Salvar relatorios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: warn
          retention-days: 7

  # ==========================================
  # JOB 2 - BUILD E SMOKE TEST
  # ==========================================

  container-smoke-test:
    name: Build e teste Docker
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v6

      - name: Construir imagem Docker
        run: |
          docker build \
            -t devops-python-api:${{ github.sha }} .

      - name: Iniciar container
        run: |
          docker run \
            --detach \
            --name devops-python-api \
            --publish 8000:8000 \
            devops-python-api:${{ github.sha }}

      - name: Testar endpoint de saude
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              echo "Container funcionando!"
              exit 0
            fi

            echo "Tentativa ${attempt}"
            sleep 2
          done

          echo "Falha no smoke test"
          exit 1

      - name: Exibir logs
        if: always()
        run: docker logs devops-python-api

      - name: Remover container
        if: always()
        run: |
          docker rm --force devops-python-api \
            2>/dev/null || true

  # ==========================================
  # JOB 3 - PUBLICAR IMAGEM NO ECR
  # ==========================================

  publish-ecr:
    name: Publicar imagem no Amazon ECR
    needs: container-smoke-test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: DES

    outputs:
      image: ${{ steps.build-image.outputs.image }}
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v6

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da imagem
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Imagem publicada: $IMAGE"

  # ==========================================
  # JOB 4 - DEPLOY DIRETAMENTE NA EC2
  # ==========================================

  deploy-ec2:
    name: Deploy na EC2
    needs: publish-ecr

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: DES

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Preparar acesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/ec2_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/ec2_key
          chmod 600 ~/.ssh/known_hosts

      - name: Autenticar Docker da EC2 no ECR
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          aws ecr get-login-password \
            --region "$AWS_REGION" |
          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            "docker login --username AWS --password-stdin '$REGISTRY'"

      - name: Atualizar container na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          IMAGE_URI: ${{ needs.publish-ecr.outputs.image }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            bash -se -- "$IMAGE_URI" "$CONTAINER_NAME" "$APP_PORT" <<'REMOTE'
          set -euo pipefail

          IMAGE="$1"
          NAME="$2"
          PORT="$3"

          echo "Baixando imagem: $IMAGE"
          docker pull "$IMAGE"

          echo "Removendo container anterior"
          docker rm -f "$NAME" 2>/dev/null || true

          echo "Iniciando novo container"
          docker run \
            --detach \
            --name "$NAME" \
            --restart unless-stopped \
            --publish "$PORT:$PORT" \
            "$IMAGE"

          echo "Verificando saude da aplicacao"
          for attempt in {1..20}; do
            if curl --fail --silent \
              "http://127.0.0.1:$PORT/health"; then
              echo "Deploy realizado com sucesso!"
              exit 0
            fi

            sleep 2
          done

          echo "Falha na verificacao de saude"
          docker logs "$NAME"
          exit 1
          REMOTE

      - name: Confirmar deploy
        run: |
          echo "Deploy concluido na Amazon EC2"
          echo "Imagem: ${{ needs.publish-ecr.outputs.image }}"
